name: Deploy the Gemini Edge Function

# Uses the repository secrets SUPABASE_ACCESS_TOKEN (a Supabase personal access token) and GEMINI_API_KEY.
# Optional: GEMINI_ALLOWED_EMAILS (variable or secret), comma-separated, limits scanning to those accounts.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/gemini-function.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-function
  cancel-in-progress: false

env:
  PROJECT_REF: xvdxdaujllhiircrstcu

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_ALLOWED_EMAILS: ${{ vars.GEMINI_ALLOWED_EMAILS || secrets.GEMINI_ALLOWED_EMAILS }}
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so the function was not deployed."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            [ -n "$GEMINI_API_KEY" ] || echo "::warning::GEMINI_API_KEY is not set; the function will answer 'not configured' until it is."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.go == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.go == 'true'
        with:
          version: latest
      - name: Store the secrets in Supabase
        if: steps.check.outputs.go == 'true'
        run: |
          umask 077
          f="$(mktemp)"
          if [ -n "$GEMINI_API_KEY" ]; then printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> "$f"; fi
          if [ -n "$GEMINI_ALLOWED_EMAILS" ]; then printf 'GEMINI_ALLOWED_EMAILS=%s\n' "$GEMINI_ALLOWED_EMAILS" >> "$f"; fi
          if [ -s "$f" ]; then supabase secrets set --env-file "$f" --project-ref "$PROJECT_REF"; fi
          rm -f "$f"
      - name: Deploy gemini-extract
        if: steps.check.outputs.go == 'true'
        run: supabase functions deploy gemini-extract --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Deploy staff-admin
        if: steps.check.outputs.go == 'true'
        run: supabase functions deploy staff-admin --project-ref "$PROJECT_REF" --no-verify-jwt
